x-pg-healthcheck: &pg-healthcheck
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 5s
    retries: 5

# The aspnet runtime image ships without curl/wget, so probe /health over bash's /dev/tcp
x-api-healthcheck: &api-healthcheck
  healthcheck:
    test:
      [
        "CMD",
        "bash",
        "-c",
        "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && head -n1 <&3 | grep -q ' 200 '",
      ]
    interval: 5s
    timeout: 5s
    retries: 10
    start_period: 10s

x-identity-conn: &identity-conn
  ConnectionStrings__IdentityDb: "Host=identity-db;Port=5432;Database=pantry_identity;Username=pantry;Password=${IDENTITY_DB_PASS}"

x-inventory-conn: &inventory-conn
  ConnectionStrings__InventoryDb: "Host=inventory-db;Port=5432;Database=pantry_inventory;Username=pantry;Password=${INVENTORY_DB_PASS}"

x-shopping-conn: &shopping-conn
  ConnectionStrings__ShoppingDb: "Host=shopping-db;Port=5432;Database=pantry_shopping;Username=pantry;Password=${SHOPPING_DB_PASS}"

x-cors-env: &cors-env
  AllowedOrigins__0: http://${GATEWAY_ADDRESS}

services:
  gateway:
    build: ./gateway
    ports:
      - "${PROXY_PORT:-80}:8080"
    depends_on:
      identity:
        condition: service_healthy
      inventory:
        condition: service_healthy
      shopping:
        condition: service_healthy
      web:
        condition: service_started

  web:
    build: ./web

  identity:
    <<: *api-healthcheck
    build: ./identity
    depends_on:
      identity-db:
        condition: service_healthy
      identity-migrator:
        condition: service_completed_successfully
    environment:
      <<: [*identity-conn, *cors-env]
      FrontendSettings__BaseUrl: http://${GATEWAY_ADDRESS}
      InventorySettings__BaseUrl: http://inventory:8080/
      SmtpSettings__Host: ${SMTP_HOST}
      SmtpSettings__Port: ${SMTP_PORT}
      SmtpSettings__Username: ${SMTP_USERNAME}
      SmtpSettings__Password: ${SMTP_PASSWORD}
      SmtpSettings__SenderName: ${SMTP_SENDER_NAME}
      SmtpSettings__SenderEmail: ${SMTP_SENDER_EMAIL}

  identity-migrator:
    environment: *identity-conn
    build:
      context: ./identity
      target: migrator
    depends_on:
      identity-db:
        condition: service_healthy

  identity-db:
    <<: *pg-healthcheck
    image: postgres:16
    environment:
      POSTGRES_DB: pantry_identity
      POSTGRES_USER: pantry
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASS}
    volumes:
      - pg-id-data:/var/lib/postgresql/data

  inventory:
    <<: *api-healthcheck
    build: ./inventory
    depends_on:
      inventory-db:
        condition: service_healthy
      inventory-migrator:
        condition: service_completed_successfully
    environment:
      <<: [*inventory-conn, *cors-env]
      IdentitySettings__BaseUrl: http://identity:8080/

  inventory-migrator:
    environment: *inventory-conn
    build:
      context: ./inventory
      target: migrator
    depends_on:
      inventory-db:
        condition: service_healthy

  inventory-db:
    <<: *pg-healthcheck
    image: postgres:16
    environment:
      POSTGRES_DB: pantry_inventory
      POSTGRES_USER: pantry
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASS}
    volumes:
      - pg-inv-data:/var/lib/postgresql/data

  shopping:
    <<: *api-healthcheck
    build: ./shopping
    depends_on:
      shopping-db:
        condition: service_healthy
      shopping-migrator:
        condition: service_completed_successfully
    environment:
      <<: [*shopping-conn, *cors-env]

  shopping-migrator:
    environment: *shopping-conn
    build:
      context: ./shopping
      target: migrator
    depends_on:
      shopping-db:
        condition: service_healthy

  shopping-db:
    <<: *pg-healthcheck
    image: postgres:16
    environment:
      POSTGRES_DB: pantry_shopping
      POSTGRES_USER: pantry
      POSTGRES_PASSWORD: ${SHOPPING_DB_PASS}
    volumes:
      - pg-shop-data:/var/lib/postgresql/data

  postgres-keycloak:
    <<: *pg-healthcheck
    image: postgres:16
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASS}
    volumes:
      - pg-keycloak-data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: start-dev
    environment:
      # Database configuration
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASS}

      # Initial admin credentials (Keycloak 26+ syntax)
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASS}

      KC_HOSTNAME: ${GATEWAY_ADDRESS}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "11384:8080"
    depends_on:
      postgres-keycloak:
        condition: service_healthy

  create-user:
    build: ./create-user
    profiles: ["bootstrap"]

volumes:
  pg-id-data:
  pg-inv-data:
  pg-shop-data:
  pg-keycloak-data:
