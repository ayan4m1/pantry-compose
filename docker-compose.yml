x-pg-healthcheck: &pg-healthcheck
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 5s
    retries: 5

services:
  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    depends_on:
      - identity
      - inventory

  identity:
    build: ./identity
    depends_on:
      postgres-identity:
        condition: service_healthy
    environment:
      ConnectionStrings__IdentityDb: "Host=postgres-identity;Port=5432;Database=pantry_identity;Username=pantry;Password=${IDENTITY_DB_PASS}"

  identity-migrator:
    build:
      context: ./identity
      target: migrator
    command:
      [
        "--connection",
        "Host=postgres-identity;Database=pantry_identity;Username=pantry;Password=${IDENTITY_DB_PASS}",
      ]
    depends_on:
      postgres-identity:
        condition: service_healthy

  inventory:
    build: ./inventory
    depends_on:
      postgres-inventory:
        condition: service_healthy
    environment:
      ConnectionStrings__InventoryDb: "Host=postgres-inventory;Port=5432;Database=pantry_inventory;Username=pantry;Password=${INVENTORY_DB_PASS}"

  inventory-migrator:
    build:
      context: ./inventory
      target: migrator
    command:
      [
        "--connection",
        "Host=postgres-inventory;Database=pantry_inventory;Username=pantry;Password=${INVENTORY_DB_PASS}",
      ]
    depends_on:
      postgres-inventory:
        condition: service_healthy

  postgres-identity:
    <<: *pg-healthcheck
    image: postgres:16
    environment:
      POSTGRES_DB: pantry_identity
      POSTGRES_USER: pantry
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASS}
    volumes:
      - pg-id-data:/var/lib/postgresql/data

  postgres-inventory:
    <<: *pg-healthcheck
    image: postgres:16
    environment:
      POSTGRES_DB: pantry_inventory
      POSTGRES_USER: pantry
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASS}
    volumes:
      - pg-inv-data:/var/lib/postgresql/data

  postgres-keycloak:
    <<: *pg-healthcheck
    image: postgres:16
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASS}
    volumes:
      - pg-keycloak-data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: start-dev
    environment:
      # Database configuration
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASS}

      # Initial admin credentials (Keycloak 26+ syntax)
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASS}

      # Hostname settings for local development
      KC_HOSTNAME: localhost
      KC_HEALTH_ENABLED: "true"
    ports:
      - "11384:8080"
    depends_on:
      postgres-keycloak:
        condition: service_healthy

volumes:
  pg-id-data:
  pg-inv-data:
  pg-keycloak-data:
